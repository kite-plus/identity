# Local identity provider for developing Kite Plus services.
# Start it with `make dev-up`; secrets come from dev/.env, which the Makefile
# generates on first run. Everything is bound to 127.0.0.1.
name: identity-dev

services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?run make dev-up}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

  zitadel:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:-v4.19.4}
    restart: unless-stopped
    # Root so setup can write the bootstrap tokens into the bind mount.
    user: "0"
    command: start-from-init --masterkeyFromEnv --tlsMode disabled
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?run make dev-up}
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: ${IDENTITY_DEV_PORT:-8090}
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:?run make dev-up}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?run make dev-up}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: Kite Plus
      ZITADEL_FIRSTINSTANCE_DEFAULTLANGUAGE: zh
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Kite Plus Operators
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin@localhost.test
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_FIRSTNAME: Kite Plus
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_LASTNAME: Admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: admin@localhost.test
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ADMIN_PASSWORD:?run make dev-up}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: identity-init
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: identity-init
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Login UI
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:${IDENTITY_DEV_PORT:-8090}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:${IDENTITY_DEV_PORT:-8090}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:${IDENTITY_DEV_PORT:-8090}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: http://localhost:${IDENTITY_DEV_PORT:-8090}/ui/v2/login/login?samlRequest=
      # The default deny list blocks private and loopback ranges, which
      # covers host.docker.internal; dev targets live there.
      ZITADEL_HTTPCLIENT_DENYLIST: 169.254.0.0/16
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${DEV_BOOTSTRAP_DIR:-./out/bootstrap}:/bootstrap
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  login:
    image: ghcr.io/zitadel/zitadel-login:${ZITADEL_VERSION:-v4.19.4}
    restart: unless-stopped
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /bootstrap/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: ${LOGIN_SESSION_COOKIE_SECRET:?run make dev-up}
      CUSTOM_REQUEST_HEADERS: Host:localhost,X-Forwarded-Proto:http
      EMAIL_VERIFICATION: "true"
    volumes:
      - ${DEV_BOOTSTRAP_DIR:-./out/bootstrap}:/bootstrap:ro
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 10s
    depends_on:
      zitadel:
        condition: service_healthy

  proxy:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:${IDENTITY_DEV_PORT:-8090}:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../deploy/nginx:/etc/nginx/identity:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/debug/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      zitadel:
        condition: service_healthy
      login:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "5000"
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025

volumes:
  db-data:
