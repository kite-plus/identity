load_module modules/ngx_http_js_module.so;

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Docker's DNS; upstreams are re-resolved when containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    js_import sessions_cookie from /etc/nginx/identity/njs/sessions_cookie.js;
    js_import reader_language from /etc/nginx/identity/njs/reader_language.js;
    js_shared_dict_zone zone=reader_language:1m timeout=600s;

    include /etc/nginx/identity/limits.conf;

    upstream zitadel_api {
        zone zitadel_api 64k;
        server zitadel:8080 resolve;
        keepalive 16;
    }

    upstream zitadel_login {
        zone zitadel_login 64k;
        server login:3000 resolve;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        include /etc/nginx/identity/identity-locations.conf;
    }

    # Actions v2 target for new users' language (njs/reader_language.js).
    # Not published: only containers on the compose network reach it.
    server {
        listen 8082;
        access_log off;
        client_body_buffer_size 64k;
        client_body_in_single_buffer on;

        location = /hooks/add-human-user {
            js_content reader_language.addHumanUser;
        }

        location / {
            return 404;
        }
    }
}
