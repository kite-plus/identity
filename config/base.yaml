# Settings shared by every environment. The environment files extend this
# one and add the issuer, SMTP, apps and identity providers.
# Apply with identity-init; never change these in the console.

instance:
  defaultLanguage: zh
  allowedLanguages: [zh, en]

orgs:
  # Created by ZITADEL setup (FirstInstance.Org.Name): admins and machine users.
  operators: Kite Plus Operators
  # Default org: readers who sign up land here.
  readers: Kite Plus

loginPolicy:
  allowUsernamePassword: true
  allowRegister: true
  allowExternalIdp: true
  forceMfa: false
  passkeys: true
  hidePasswordReset: false
  # Do not reveal whether an account exists on the login name page.
  ignoreUnknownUsernames: true
  allowDomainDiscovery: false
  disableLoginWithEmail: false
  disableLoginWithPhone: true
  # R7: a sign-in lasts 30 days, also across browser restarts (the proxy
  # makes the login UI cookie persistent, see deploy/nginx/njs).
  passwordCheckLifetime: 720h
  externalLoginCheckLifetime: 720h
  # Passkey sign-ins use the multi-factor lifetime.
  multiFactorCheckLifetime: 720h
  secondFactorCheckLifetime: 720h
  # 0 never nags readers to set up a second factor.
  mfaInitSkipLifetime: 0s
  secondFactors: [otp, u2f]
  multiFactors: [u2f_with_verification]

# R9: admins live in the operators org, whose own policy forces MFA.
operatorLoginPolicy:
  forceMfa: true
  passwordCheckLifetime: 12h
  multiFactorCheckLifetime: 12h

# No lockout on failed passwords: ZITADEL's lock is permanent until an admin
# unlocks it, so anyone knowing a reader's email could lock them out. The
# proxy's per-IP and global rate limits cap guessing instead (R10). A
# one-time code is only asked after a correct password, so its lockout stays.
lockout:
  maxPasswordAttempts: 0
  maxOtpAttempts: 10

passwordComplexity:
  minLength: 10
  hasUppercase: false
  hasLowercase: false
  hasNumber: false
  hasSymbol: false

privacy:
  tosLink: ""
  privacyLink: ""
  helpLink: ""
  supportEmail: ""
  docsLink: ""

branding:
  primaryColor: "#4A77D6"
  backgroundColor: "#FFFFFF"
  warnColor: "#CD3D56"
  fontColor: "#1B1D23"
  primaryColorDark: "#8FB0FF"
  backgroundColorDark: "#1B1D23"
  warnColorDark: "#FF3B5B"
  fontColorDark: "#F3F4F6"
  hideLoginNameSuffix: true
  disableWatermark: true
  logo: branding/logo.svg
  logoDark: branding/logo-dark.svg
  icon: branding/favicon.svg
  iconDark: branding/logo-dark.svg

# R6: readers can delete their own account (account page or the API).
# New sign-ups get the role on the next run; production runs
# `identity-init -only readers` every few minutes (docs/runbooks).
readerSelfDeletion: true

# R8: the login UI creates users without a language and ZITADEL then mails
# them in English. This Actions v2 call target, served by the proxy, sets the
# registering browser's language (zh or en), else zh.
readerLanguage:
  endpoint: http://proxy:8082/hooks/add-human-user

# User events pushed to every app's webhook (R5).
events:
  - user.removed
  - user.deactivated
  - user.reactivated
  - user.locked
  - user.unlocked

# Instance role of the per-app sync machine users. The only built-in
# read-only role that includes events.read.
syncRole: IAM_OWNER_VIEWER
syncTokenLifetime: 8760h

idps:
  github:
    name: GitHub
    clientId: ${GITHUB_CLIENT_ID:-}
    clientSecret: ${GITHUB_CLIENT_SECRET:-}
    scopes: [read:user, user:email]
  apple:
    name: Apple
    clientId: ${APPLE_CLIENT_ID:-}
    teamId: ${APPLE_TEAM_ID:-}
    keyId: ${APPLE_KEY_ID:-}
    privateKeyFile: ${APPLE_PRIVATE_KEY_FILE:-}
    scopes: [name, email]

# Login UI strings that would otherwise say "Zitadel".
loginTexts:
  zh:
    common:
      title: 登录 Kite Plus 账号
    register:
      description: 创建你的 Kite Plus 账号。
    idp:
      signInWithZitadel: 用 Kite Plus 账号登录
  en:
    common:
      title: Sign in to your Kite Plus Account
    register:
      description: Create your Kite Plus Account.
    idp:
      signInWithZitadel: Sign in with Kite Plus Account

# Mail texts. identity-mailer lays them out as: preHeader the small label,
# title the heading, text the body, footerText the note under the dashed
# rule; the code, when there is one, gets its own box.
messages:
  - type: verifyemail
    language: zh
    title: 验证你的邮箱
    preHeader: 验证邮箱
    subject: 验证你的 Kite Plus 账号邮箱
    greeting: "你好，{{.DisplayName}}："
    text: 点下面的按钮验证这个邮箱；如果你还停在验证页面，也可以输入验证码。验证之后，就能用这个账号登录 Explore 和 Kite 评论。
    buttonText: 验证邮箱
    footerText: 不是你本人操作？忽略这封邮件即可。
  - type: verifyemail
    language: en
    title: Verify your email
    preHeader: Verify email
    subject: Verify your Kite Plus Account email
    greeting: "Hello {{.DisplayName}},"
    text: Use the button below to verify this address, or enter the code on the verification page. Once it is verified, you can sign in to Explore and Kite Comments with this account.
    buttonText: Verify email
    footerText: "Didn't request this? You can ignore this email."
  - type: passwordreset
    language: zh
    title: 重置你的密码
    preHeader: 重置密码
    subject: 重置你的 Kite Plus 账号密码
    greeting: "你好，{{.DisplayName}}："
    text: 我们收到了重置 Kite Plus 账号密码的请求。点下面的按钮设置新密码；如果你还停在重置页面，也可以直接输入验证码。
    buttonText: 设置新密码
    footerText: 没有申请重置？忽略这封邮件即可，你的密码不会改变。
  - type: passwordreset
    language: en
    title: Reset your password
    preHeader: Reset password
    subject: Reset your Kite Plus Account password
    greeting: "Hello {{.DisplayName}},"
    text: We received a request to reset the password of your Kite Plus Account. Use the button below to set a new one, or enter the code on the reset page.
    buttonText: Set a new password
    footerText: "Didn't ask for this? Ignore this email and your password stays the same."
  - type: password_change
    language: zh
    title: 你的密码已修改
    preHeader: 密码已修改
    subject: 你的 Kite Plus 账号密码已修改
    greeting: "你好，{{.DisplayName}}："
    text: 你的 Kite Plus 账号密码刚刚被修改。
    buttonText: 登录账号
    footerText: 不是你本人操作？请立即重置密码，并检查账号里的登录设备。
  - type: password_change
    language: en
    title: Your password was changed
    preHeader: Password changed
    subject: Your Kite Plus Account password was changed
    greeting: "Hello {{.DisplayName}},"
    text: The password of your Kite Plus Account was just changed.
    buttonText: Sign in
    footerText: "Not you? Reset your password right away and check the devices signed in to your account."
  - type: init
    language: zh
    title: 完成你的账号设置
    preHeader: 完成注册
    subject: 完成你的 Kite Plus 账号注册
    greeting: "你好，{{.DisplayName}}："
    text: "你的 Kite Plus 账号已经创建，登录名是 {{.PreferredLoginName}}。点下面的按钮完成设置。"
    buttonText: 完成设置
    footerText: 不是你本人操作？忽略这封邮件即可。
  - type: init
    language: en
    title: Finish setting up your account
    preHeader: Finish sign-up
    subject: Finish setting up your Kite Plus Account
    greeting: "Hello {{.DisplayName}},"
    text: "Your Kite Plus Account was created with the login name {{.PreferredLoginName}}. Use the button below to finish setting it up."
    buttonText: Finish setup
    footerText: "Didn't request this? You can ignore this email."
  - type: verifyemailotp
    language: zh
    title: 你的登录验证码
    preHeader: 验证码
    subject: 你的 Kite Plus 账号验证码
    greeting: "你好，{{.DisplayName}}："
    text: 在登录页面输入下面的验证码，五分钟内有效。
    buttonText: 验证
    footerText: 不是你本人在登录？忽略这封邮件即可，并考虑修改密码。
  - type: verifyemailotp
    language: en
    title: Your sign-in code
    preHeader: Sign-in code
    subject: Your Kite Plus Account code
    greeting: "Hello {{.DisplayName}},"
    text: Enter this code on the sign-in page. It is valid for five minutes.
    buttonText: Verify
    footerText: "Not you signing in? Ignore this email, and consider changing your password."
  - type: passwordless_registration
    language: zh
    title: 添加通行密钥
    preHeader: 通行密钥
    subject: 为你的 Kite Plus 账号添加通行密钥
    greeting: "你好，{{.DisplayName}}："
    text: 我们收到了为这个账号添加通行密钥（Passkey）的请求。在要添加的设备上点下面的按钮。
    buttonText: 添加通行密钥
    footerText: 不是你本人操作？忽略这封邮件即可。
  - type: passwordless_registration
    language: en
    title: Add a passkey
    preHeader: Passkey
    subject: Add a passkey to your Kite Plus Account
    greeting: "Hello {{.DisplayName}},"
    text: We received a request to add a passkey to this account. Use the button below on the device you want to add.
    buttonText: Add passkey
    footerText: "Didn't request this? You can ignore this email."
