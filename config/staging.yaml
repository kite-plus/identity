# Staging: id-staging.kite.plus, its own compose project and database next
# to production. Every upgrade and configuration change runs here first.
extends: base.yaml
environment: staging
issuer: https://id-staging.kite.plus

mailer:
  # identity-mailer on the compose network (deploy/mailer); it sends
  # through MAILER_SMTP_URL.
  description: mailer
  endpoint: http://mailer:8080/zitadel/email

apps:
  - key: explore
    name: Explore
    redirectUris:
      - https://explore-staging.kite.plus/auth/callback
    postLogoutRedirectUris:
      - https://explore-staging.kite.plus/
    backChannelLogoutUri: https://explore-staging.kite.plus/auth/backchannel-logout
    webhookUrl: https://explore-staging.kite.plus/hooks/idp
  - key: comments
    name: Comments
    redirectUris:
      - https://comments-staging.kite.plus/auth/callback
    postLogoutRedirectUris:
      - https://comments-staging.kite.plus/
    backChannelLogoutUri: https://comments-staging.kite.plus/auth/backchannel-logout
    webhookUrl: https://comments-staging.kite.plus/hooks/idp
