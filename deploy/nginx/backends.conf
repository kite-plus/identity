# What the standalone and the edge proxy share, in the http context: njs,
# rate limits, the upstreams and the container health check. Each expects
# $identity_scheme to be defined (the scheme readers use).

js_import sessions_cookie from /etc/nginx/identity/njs/sessions_cookie.js;
js_import reader_language from /etc/nginx/identity/njs/reader_language.js;
js_shared_dict_zone zone=reader_language:1m timeout=600s;

include /etc/nginx/identity/limits.conf;

upstream zitadel_api {
    zone zitadel_api 64k;
    server zitadel:8080 resolve;
    keepalive 32;
}

upstream zitadel_login {
    zone zitadel_login 64k;
    server login:3000 resolve;
    keepalive 32;
}

# Container health check only.
server {
    listen 127.0.0.1:8081;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
