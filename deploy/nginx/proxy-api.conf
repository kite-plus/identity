proxy_pass http://zitadel_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
# ZITADEL derives the issuer and every public URL from Host, so pass it with
# the port (dev runs on a non-default port).
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Clients must not choose the instance or public host: ZITADEL would build
# issuer, links in mails and redirects from them.
proxy_set_header X-Forwarded-Host "";
proxy_set_header Forwarded "";
proxy_set_header X-Zitadel-Forwarded "";
proxy_set_header X-Zitadel-Instance-Host "";
proxy_set_header X-Zitadel-Public-Host "";
proxy_read_timeout 60s;
