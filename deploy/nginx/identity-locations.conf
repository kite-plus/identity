# Routing for one ZITADEL instance behind a single origin. Included in the
# server context by both the dev and the production proxy; expects the
# upstreams "zitadel_api" and "zitadel_login" to be defined.

client_max_body_size 2m;

location = / {
    return 302 /ui/v2/login;
}

# Login v1 is not used (login v2 is required) but still answers; keep its
# forms out of reach so nothing bypasses the limits below.
location ^~ /ui/login/ {
    return 404;
}

# Registration also notes the browser's language for new readers
# (njs/reader_language.js), then proxies like the other login pages.
location ~ ^/ui/v2/login/register(/|$) {
    limit_req zone=identity_mail burst=10 nodelay;
    limit_req zone=identity_login burst=30 nodelay;
    limit_req zone=identity_global burst=300 nodelay;
    client_body_buffer_size 64k;
    client_body_in_single_buffer on;
    js_content reader_language.remember;
}

location ~ ^/ui/v2/login/(verify|password|otp|account)(/|$) {
    limit_req zone=identity_mail burst=10 nodelay;
    limit_req zone=identity_login burst=30 nodelay;
    limit_req zone=identity_global burst=300 nodelay;
    js_header_filter sessions_cookie.persist;
    include /etc/nginx/identity/proxy-login.conf;
}

# Apps still link to the console's account page.
location = /ui/console/users/me {
    absolute_redirect off;
    return 302 /ui/v2/login/account;
}
location = /ui/console/users/me/ {
    absolute_redirect off;
    return 302 /ui/v2/login/account;
}

# The operators' console takes the logo and icon from the label policy but
# not the page title, so the title is rewritten here.
location ^~ /ui/console/ {
    include /etc/nginx/identity/proxy-api.conf;
    proxy_set_header Accept-Encoding "";
    sub_filter '<title>ZITADEL' '<title>Kite Plus';
    sub_filter 'Management Console</title>' 'Account</title>';
}

location @login {
    js_header_filter sessions_cookie.persist;
    include /etc/nginx/identity/proxy-login.conf;
}

# Plain prefix (not ^~) so the regex location above is still checked first.
location /ui/v2/login {
    limit_req zone=identity_login burst=30 nodelay;
    js_header_filter sessions_cookie.persist;
    include /etc/nginx/identity/proxy-login.conf;
}

location ^~ /oauth/v2/ {
    limit_req zone=identity_oidc burst=100 nodelay;
    include /etc/nginx/identity/proxy-api.conf;
}

location ^~ /oidc/v1/ {
    limit_req zone=identity_oidc burst=100 nodelay;
    include /etc/nginx/identity/proxy-api.conf;
}

location / {
    include /etc/nginx/identity/proxy-api.conf;
}
