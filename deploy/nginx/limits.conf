# Rate limits for the sign-in endpoints (R10). Included in the http context
# by both the dev and the production proxy.
#
# The login UI is a Next.js app: every form submission is a POST (a server
# action) to the page URL, so limiting POSTs per page covers sign-in,
# registration, codes and password reset without touching page loads.
# Rates are generous because many readers in China sit behind carrier NAT
# and share one address; ZITADEL's account lockout covers per-account
# guessing.

map $request_method $identity_post_client {
    POST    $binary_remote_addr;
    default "";
}

# Pages whose actions send mail: registration, verification codes,
# password reset and one-time codes.
limit_req_zone $identity_post_client zone=identity_mail:10m rate=10r/m;
# Every other login UI form.
limit_req_zone $identity_post_client zone=identity_login:10m rate=60r/m;
# All clients together on the pages that check passwords and codes. ZITADEL
# no longer locks accounts after failed passwords (a lock is permanent and
# anyone could trigger it), so this caps distributed guessing; the burst
# lets a rush of real readers through.
map $request_method $identity_post_all {
    POST    all;
    default "";
}
limit_req_zone $identity_post_all zone=identity_global:1m rate=600r/m;
# OIDC endpoints: authorize, token, end_session, introspection.
limit_req_zone $binary_remote_addr zone=identity_oidc:10m rate=300r/m;

limit_req_status 429;
limit_req_log_level warn;
