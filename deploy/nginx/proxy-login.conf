proxy_pass http://zitadel_login;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# The login UI builds verification and reset links from the forwarded host;
# pin it to the host the proxy accepted.
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header Forwarded "";
proxy_set_header X-Zitadel-Forwarded "";
proxy_set_header X-Zitadel-Instance-Host "";
proxy_set_header X-Zitadel-Public-Host "";
proxy_read_timeout 60s;
